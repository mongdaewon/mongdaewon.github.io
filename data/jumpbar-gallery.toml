# Jumpbar - keyword gallery (/apps/jumpbar/gallery/).
# Tapping an entry opens mdjumpbar://add and prefills the app's add form.
#
# Conventions (same as tools.toml): base field = English, `_ko` = Korean override.
#   keyword  what you type in the address bar. Unique across this file, and must not
#            collide with the app's built-ins (Shared/Presets.swift): yt wk az mp tr
#            gh gg dd nv nm cp rk kl lb fk yh.
#            ⚠ yh was ch until the release that follows this file - ch went to ChatGPT here,
#            because Yahoo!知恵袋 only shows on Japanese-language devices while ChatGPT is
#            everywhere. Ship the app update before this row goes live, or a Japanese device
#            sees ch twice.
#            Korean entries use hangul initials so a Korean typist never has to switch
#            the keyboard to English mid-search. One letter where it is free, two where
#            it collides. Other languages can do the same with their own script.
#   name     site name shown in the app. name_ko overrides it on the Korean page.
#   url      search address with {query} where the search words go.
#   locale   which group it shows under: "ko" (Korea) or "en" (global/English).
#
# The row shows name + host only. There is no description field - the list is long and a
# sentence per row turns it into a wall. The host is a link to the site itself.
#
# Do not list a site the app already ships as a built-in - it would show up twice on the
# user's screen with a different keyword.
#
# ⚠️ Every url here was checked against the live site. Before adding one, search that
#    site for a real two-word phrase and copy the resulting address - a guessed address
#    sends people to a broken page. Nothing here goes through a PR review, so nobody else
#    checks the address for you.

# ---------- Korea ----------
# Keywords are hangul initials so a Korean typist never switches keyboards mid-search.
# Grouped by what people are looking for, because the page renders in file order.

