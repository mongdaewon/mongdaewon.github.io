# QuickSearch for Safari - keyword gallery (/apps/quicksearch/gallery/).
# Tapping an entry opens mdquicksearch://add and prefills the app's add form.
#
# Conventions (same as tools.toml): base field = English, `_ko` = Korean override.
#   keyword  what you type in the address bar. Unique across this file, and must not
#            collide with the app's built-ins: nv, az, yt, wk.
#            Korean entries use hangul initials (ㄴ = 나무위키) so a Korean typist
#            never has to switch the keyboard to English mid-search. One letter where
#            it is free, two where it collides (ㄷ 다음 / ㄷㄴ 다나와 / ㄷㄱ 당근).
#            Other languages can do the same with their own script.
#   name     site name shown in the app. name_ko overrides it on the Korean page.
#   url      search address with {query} where the search words go.
#   desc     one line on what the site is for. desc_ko overrides it on the Korean page.
#   locale   which group it shows under: "ko" (Korea) or "en" (global/English).
#
# ⚠️ Every url here was checked against the live site. If you add one in a PR,
#    search that site for a real word first and copy the resulting address -
#    a guessed address sends people to a broken page.

# ---------- Korea ----------

[[site]]
  keyword = "ㄴ"
  name = "Namu Wiki"
  name_ko = "나무위키"
  url = "https://namu.wiki/Search?q={query}"
  desc = "Korean wiki that goes deep on pop culture, games, and internet slang."
  desc_ko = "대중문화·게임·인터넷 유행어까지 깊게 다루는 한국어 위키."
  locale = "ko"

[[site]]
  keyword = "ㄷ"
  name = "Daum"
  name_ko = "다음"
  url = "https://search.daum.net/search?q={query}"
  desc = "Korean portal search. Often surfaces different results than Naver."
  desc_ko = "네이버와는 다른 결과를 보여주는 한국 포털 검색."
  locale = "ko"

[[site]]
