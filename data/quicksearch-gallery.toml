  url = "https://kin.naver.com/search/list.naver?query={query}"
  desc = "Q&A archive where Koreans answer each other's everyday questions."
  desc_ko = "나와 같은 걸 궁금해했던 사람들의 질문과 답."
  locale = "ko"

[[site]]
