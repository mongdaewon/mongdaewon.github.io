# QuickSearch for Safari - keyword gallery (/apps/quicksearch/gallery/).
# Tapping an entry opens mdquicksearch://add and prefills the app's add form.
#
# Conventions (same as tools.toml): base field = English, `_ko` = Korean override.
#   keyword  short letters typed in the address bar. Unique across this file, and
#            must not collide with the app's built-ins: nv, az, yt, wk.
#   name     site name shown in the app. name_ko overrides it on the Korean page.
#   url      search address with {query} where the search words go.
#   locale   which group it shows under: "ko" (Korea) or "en" (global/English).
#
# ⚠️ Every url here was checked against the live site. If you add one in a PR,
#    search that site for a real word first and copy the resulting address -
#    a guessed address sends people to a broken page.

# ---------- Korea ----------

[[site]]
  keyword = "nm"
  name = "Namu Wiki"
  name_ko = "나무위키"
  url = "https://namu.wiki/Search?q={query}"
  locale = "ko"

