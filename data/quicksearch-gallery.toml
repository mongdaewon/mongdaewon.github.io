  url = "https://search.naver.com/search.naver?where=blog&query={query}"
  desc = "Reviews, restaurants, and travel logs written by Korean bloggers."
  desc_ko = "후기·맛집·여행기처럼 사람이 직접 쓴 글만 모아 봅니다."
  locale = "ko"

[[site]]
