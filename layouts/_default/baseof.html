<!doctype html>
<html lang="{{ .Site.Language.Lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>(function(){var t=localStorage.getItem('theme');if(t)document.documentElement.setAttribute('data-theme',t);})();</script>
  <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} · {{ .Site.Title }}{{ end }}</title>
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <style>
    :root {
      --pico-font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Apple SD Gothic Neo", sans-serif;
      --pico-border-radius: 0.6rem;
    }
    body > header, body > main, body > footer { max-width: 46rem; margin-inline: auto; padding-inline: 1.25rem; }
    body > main { padding-block: 1rem 2rem; }

    /* header */
    .site-header { display: flex; align-items: center; gap: 1rem; padding-block: 1rem; }
    .brand { display: flex; align-items: center; gap: .55rem; font-weight: 700; font-size: 1.15rem; text-decoration: none; color: inherit; }
    .brand .logo { width: 30px; height: 30px; border-radius: 7px; background: linear-gradient(135deg, #6366f1, #8b5cf6); }
    .site-header nav { margin-left: auto; display: flex; align-items: center; gap: 1rem; font-size: .9rem; }
    .site-header nav a { text-decoration: none; }
    .langs { display: flex; gap: .4rem; }
    .langs a { opacity: .55; }
    .langs a.active { opacity: 1; font-weight: 600; }
    .theme-toggle { background: transparent; border: none; padding: .1rem .2rem; margin: 0; width: auto; cursor: pointer; font-size: 1.05rem; line-height: 1; color: inherit; }

    /* app list rows */
    .app-list { margin-block: 1rem; }
    .app-row { display: flex; align-items: center; gap: 1rem; padding: 1rem 0; border-top: 1px solid var(--pico-muted-border-color); }
    .app-list .app-row:last-child { border-bottom: 1px solid var(--pico-muted-border-color); }
    .app-ico { flex: 0 0 auto; width: 60px; height: 60px; border-radius: 14px; display: grid; place-items: center; font-size: 1.9rem; color: #fff; object-fit: cover; border: 1px solid var(--pico-muted-border-color); }
    .app-main { display: flex; align-items: center; gap: 1rem; flex: 1; min-width: 0; text-decoration: none; color: inherit; }
    .app-info { min-width: 0; }
    .app-info .name { display: block; font-size: 1.02rem; font-weight: 600; }
    .app-main:hover .name { color: var(--pico-primary); }
    .app-info .desc { color: var(--pico-muted-color); font-size: .86rem; }
    .app-dl { flex: 0 0 auto; display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; justify-content: flex-end; }
    .app-dl a { display: inline-flex; line-height: 0; }
    .app-dl img.store-badge { width: 150px; height: auto; display: block; }
    .app-dl .badge { display: inline-block; font-size: .78rem; padding: .35rem .8rem; border-radius: 99px; border: 1px solid var(--pico-muted-border-color); color: var(--pico-muted-color); }

    /* app detail */
    .app-head { display: flex; align-items: center; gap: 1.2rem; margin-bottom: 1.5rem; border: 0; padding: 0; }
    .app-head .app-ico { width: 84px; height: 84px; border-radius: 19px; font-size: 2.6rem; }
    .app-head h1 { margin: 0; font-size: 1.5rem; }
    .app-head .tagline { margin: .3rem 0 0; color: var(--pico-muted-color); font-size: 1.05rem; }
    .app-benefits { font-size: 1.05rem; line-height: 1.7; margin-bottom: 2rem; }
    .app-download { display: flex; flex-wrap: wrap; gap: .6rem; margin-bottom: 1.5rem; }
    .app-download a { display: inline-flex; line-height: 0; }
    .app-download img.store-badge { width: 176px; }
    .privacy { font-size: .85rem; }
    .backlink { font-size: .85rem; }

    /* home hero */
    .hero { margin: 1rem 0 .5rem; }
    .hero h1 { margin-bottom: .2rem; }
    .hero p { color: var(--pico-muted-color); }

    /* footer */
    .site-footer { color: var(--pico-muted-color); font-size: .82rem; padding-block: 2rem; border-top: 1px solid var(--pico-muted-border-color); margin-top: 2rem; }

    @media (max-width: 520px) {
      .app-row { flex-wrap: wrap; }
      .app-dl { flex-basis: 100%; justify-content: flex-start; padding-left: 76px; }
      .app-head { flex-direction: column; align-items: flex-start; text-align: left; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{ .Site.Home.RelPermalink }}"><span class="logo"></span>Mongdaewon</a>
    <nav>
      <a href="{{ with .Site.GetPage "/apps" }}{{ .RelPermalink }}{{ end }}">{{ if eq .Site.Language.Lang "ko" }}앱{{ else }}Apps{{ end }}</a>
      <span class="langs">
        {{ range .AllTranslations }}
          <a href="{{ .RelPermalink }}"{{ if eq .Language.Lang $.Site.Language.Lang }} class="active"{{ end }}>{{ .Language.Params.displayName }}</a>
        {{ end }}
      </span>
      <button class="theme-toggle" type="button" aria-label="Toggle theme">☾</button>
    </nav>
  </header>

  <main>
    {{ block "main" . }}{{ end }}
  </main>

  <footer class="site-footer">
    © {{ now.Year }} Mongdaewon · <a href="mailto:mongdaewon@naver.com">mongdaewon@naver.com</a>
  </footer>

  <script>
    (function () {
      var root = document.documentElement, btn = document.querySelector('.theme-toggle');
      function sysDark() { return window.matchMedia('(prefers-color-scheme: dark)').matches; }
      function cur() { return root.getAttribute('data-theme') || (sysDark() ? 'dark' : 'light'); }
      function paint() { btn.textContent = cur() === 'dark' ? '☀' : '☾'; }
      paint();
      btn.addEventListener('click', function () {
        var next = cur() === 'dark' ? 'light' : 'dark';
        root.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
        paint();
      });
    })();
  </script>
</body>
</html>
